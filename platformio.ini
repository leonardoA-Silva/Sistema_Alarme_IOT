; ---------------------------------------------------
; AMBIENTE DO PROJETO
; ---------------------------------------------------

[env:esp32doit-devkit-v1]

; Plataforma utilizada
platform = espressif32

; Modelo da placa
board = esp32doit-devkit-v1

; Utiliza o framework Arduino
framework = arduino


; ---------------------------------------------------
; COMUNICACAO
; ---------------------------------------------------

; Velocidade utilizada para enviar o programa
; para a ESP32
upload_speed = 115200

; Velocidade utilizada pelo Monitor Serial
monitor_speed = 115200


; ---------------------------------------------------
; BIBLIOTECAS
; ---------------------------------------------------

; Faz uma busca mais profunda pelas dependencias
; utilizadas pelas bibliotecas
lib_ldf_mode = deep+

; Biblioteca utilizada para comunicação
; com o Adafruit IO
lib_deps =
    adafruit/Adafruit IO Arduino @ ^4.3.7
    teckel12/NewPing @ ^1.9.7

; Bibliotecas Wi-Fi que não serão utilizadas,
; pois a ESP32 possui Wi-Fi nativo
lib_ignore =
    WiFiNINA
    WiFiNINA_-_Adafruit_Fork
    WiFiNINA - Adafruit Fork